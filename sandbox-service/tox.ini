[tox]
envlist = pylint, bandit, audit, pytest

# Every env is built by `uv sync --locked` against the workspace uv.lock, so the crczp-*
# libraries install editable from libs/ and every third-party version is exactly what the
# lockfile pins - the same set the image ships.
#
# NOTE: this runner does not support `deps =` at all, it is silently ignored. Tooling
# belongs in the [dependency-groups] tables in pyproject.toml.
[testenv]
runner = uv-venv-lock-runner
# Test what the image ships (python:3.12-slim), not whatever interpreter runs tox -
# without this tox-uv derives it from its own tool env, which is 3.14 here.
base_python = python3.12
# Also declared in [tool.pytest.ini_options] so `uv run pytest` works without tox. Kept
# here because this env runs `python manage.py check` too, which is not pytest and would
# otherwise fall back to manage.py's production-settings default.
setenv = DJANGO_SETTINGS_MODULE=crczp.sandbox_service_project.tests.settings

[testenv:pylint]
dependency_groups = lint
setenv = DJANGO_SETTINGS_MODULE=crczp.sandbox_service_project.settings
commands = pylint crczp --load-plugins=pylint_django --output-format=colorized --fail-under=9.5

# bandit and pip-audit read files and the lockfile, not an importable tree, so
# --only-group installs the tooling alone: no project, no runtime dependencies.
[testenv:bandit]
package = skip
only_groups = security
commands = bandit -r crczp -c pyproject.toml

# Audit the locked runtime set rather than re-resolving it. `pip-audit .` would resolve
# with pip, which knows nothing of [tool.uv.sources] or uv.lock, so it would audit
# published sibling wheels instead of this tree. --no-default-groups drops the `dev`
# stubs, which are not shipped, leaving exactly the set the Dockerfile installs.
[testenv:audit]
package = skip
only_groups = security
commands =
    uv export --locked --no-default-groups --no-emit-workspace --no-hashes --no-annotate --no-header -o {env_tmp_dir}/requirements.txt
    pip-audit --progress-spinner=off --no-deps --requirement {env_tmp_dir}/requirements.txt

[testenv:pytest]
dependency_groups = test
commands =
    pytest -m "not integration" {posargs}
    pytest -m "integration" {posargs}
    python manage.py check
