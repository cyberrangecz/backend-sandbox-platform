[project]
name = "crczp-sandbox-service"
version = "3.1.0"
description = "simplifies manipulation of OpenStack cloud platform for CyberRangeCZ Platform purposes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "cybersecurityhub.cz" }]
dependencies = [
    "crczp-terraform-client",
    "crczp-python-commons",
    "crczp-openstack-lib",
    "crczp-aws-lib",
    "crczp-topology-definition",
    "drf-oidc-auth ~=3.0.0",
    "pyjwkest ~=1.4.4",
    "crczp-automated-problem-generation-lib",
    # https://github.com/snguyenthanh/better_profanity/issues/19
    "better-profanity ==0.6.1",
    "django ~=5.0",
    "djangorestframework ==3.17.2",
    "coreapi ~=2.3.3",
    "structlog ~=26.1.0",
    "colorama ~=0.4.6",
    "djangorestframework-yaml ~=2.0.0",
    "pyyaml ~=6.0.3",
    "ruamel.yaml <0.18.0",
    "gitpython ~=3.1.59",
    "requests ~=2.34.2",
    "django-model-utils ~=5.0.0",
    # https://github.com/rq/django-rq/issues/616#event-15494980339
    "rq ==1.13.0",
    "django-rq ~=2.8.0",
    "redis ==6.4.0",
    "hiredis ~=3.4.1",
    "docker ~=7.2.0",
    "ssh_config ~=0.1.6",
    "python-gitlab ~=8.5.0",
    "jinja2 ~=3.1.6",
    "django-cors-headers ~=4.9.0",
    "psycopg2-binary ~=2.9.12",
    "packaging ~=26.3",
    "six ~=1.17.0",
    "drf-spectacular ~=0.30.0",
    # security-sensitive: pinned exactly rather than compatible-release
    "cryptography ==50.0.0",
    "pyparsing ~=3.3.2",
    "kubernetes ~=36.0.3",
    # security-sensitive: pinned exactly rather than compatible-release
    "paramiko ==5.0.0",
    "pygithub ~=2.9.1",
    "gunicorn ~=26.0.0"
]

[project.urls]
GitHub = "https://github.com/cyberrangecz/backend-sandbox-platform"

[tool.uv.sources]
crczp-terraform-client = { workspace = true }
crczp-python-commons = { workspace = true }
crczp-openstack-lib = { workspace = true }
crczp-aws-lib = { workspace = true }
crczp-topology-definition = { workspace = true }
crczp-automated-problem-generation-lib = { workspace = true }

[build-system]
# TODO: Replace this with uv_build when it is it released for GA.
#   https://github.com/astral-sh/uv/issues/3957
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# `dev` is uv's only default group: it is what a workspace-root `uv sync` installs, and so
# what `ty` and pre-commit see. The tox groups below are deliberately NOT part of it -
# tox-uv passes --no-default-groups, so they never mix.
dev = [
    "django-stubs ~=6.1.0",
    # Held one patch behind djangorestframework on purpose: 3.17.1 retyped Request.data as
    # dict | list, which the views do not handle yet. Bump only together with those views.
    "djangorestframework-stubs==3.17.0",
    "types-requests ~=2.33.0.20260712",
    "types-paramiko ~=5.0.0.20260724",
]

test = [
    "pytest",
    "pytest-django",
    "pytest-mock",
    "pytest-structlog",
    "fakeredis[lua]",
]

lint = [
    "pylint",
    "pylint-django",
    # `pylint crczp` lints crczp/*/tests too, so it needs whatever the tests import.
    { include-group = "test" },
]

security = [
    "bandit",
    "pip-audit",
]

[tool.hatch.build.targets.wheel]
packages = ["crczp"]
# `exclude-packages` is not a hatchling option - it was silently ignored, and the wheel
# shipped 64 test files. Patterns here are gitignore-style: the leading slash anchors at
# the project root and `*` spans exactly one segment, so this covers every app's tests/
# without listing them. The libraries need no equivalent; their tests/ sit outside the
# `packages` include set.
exclude = ["/crczp/*/tests"]
skip-excluded-dirs = true

[tool.ruff]
line-length = 100
preview = true
src = ["crczp"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.lint.isort]
known-first-party = ["crczp"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.pylint.main]
ignore-paths = [".*/migrations/.*"]

[tool.pylint.messages_control]
disable = [
    "duplicate-code",
    "abstract-method",
]

[tool.bandit]
skips = ["B101"]

[tool.pytest.ini_options]
# Declared here as well as in tox.ini's setenv so `uv run pytest` works without tox.
DJANGO_SETTINGS_MODULE = "crczp.sandbox_service_project.tests.settings"
minversion = "6.0"
addopts = "-ra -q"
markers = [
    "integration: mark test as integration test requiring external services (e.g. Redis)",
]
testpaths = [
    "crczp/sandbox_ansible_app/tests",
    "crczp/sandbox_common_lib/tests",
    "crczp/sandbox_definition_app/tests",
    "crczp/sandbox_instance_app/tests",
    "crczp/sandbox_service_project/tests",
]
