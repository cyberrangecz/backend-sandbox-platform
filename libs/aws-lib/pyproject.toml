[project]
name = "crczp-aws-lib"
version = "1.0.4"
description = "Cyberrangecz platform AWS Driver Python lib"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Juraj Paluba", email = "4492988@mail.muni.cz" }]
dependencies = [
    "PyYAML>=6.0.2",
    "crczp-python-commons",
    "jinja2>=3.1.3",
    "boto3>=1.38.40"
]

[dependency-groups]
test = [
    "pytest",
    "pytest-mock",
    "pytest-structlog",
]

lint = [
    "pylint",
    # pylint lints tests/ too, so it needs whatever the tests import.
    { include-group = "test" },
]

security = [
    "bandit",
    "pip-audit",
]

[project.urls]
GitHub = "https://github.com/cyberrangecz/backend-sandbox-platform"

[tool.uv.sources]
crczp-python-commons = { workspace = true }

[build-system]
# TODO: Replace this with uv_build when it is it released for GA.
#   https://github.com/astral-sh/uv/issues/3957
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crczp"]

[tool.ruff]
line-length = 100
preview = true

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.lint.isort]
# pylint resolves `crczp` as first-party from the directory layout; without this ruff
# would rank the installed crczp.* packages as third-party and the two disagree on order.
known-first-party = ["crczp"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.pylint]
# You can add pylint configs here or in .pylintrc

[tool.bandit]
skips = ["B101"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
