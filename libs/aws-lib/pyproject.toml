[project]
name = "crczp-aws-lib"
version = "1.1.0"
description = "Cyberrangecz platform AWS Driver Python lib"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Juraj Paluba", email = "4492988@mail.muni.cz" }]
dependencies = [
    "pyyaml>=6.0.3",
    "crczp-python-commons",
    "crczp-topology-definition",
    "jinja2>=3.1.6",
    "boto3>=1.38.40"
]

[dependency-groups]
test = [
    "pytest",
    "pytest-mock",
    "pytest-structlog",
]

lint = [
    "pylint",
    # pylint lints tests/ too, so it needs whatever the tests import.
    { include-group = "test" },
]

[project.urls]
GitHub = "https://github.com/cyberrangecz/backend-sandbox-platform"

[tool.uv.sources]
crczp-python-commons = { workspace = true }
crczp-topology-definition = { workspace = true }

[build-system]
# TODO: Replace this with uv_build when it is it released for GA.
#   https://github.com/astral-sh/uv/issues/3957
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crczp"]

[tool.ruff]
# Shared settings live in the workspace root pyproject.toml; only deviations go here.
extend = "../../pyproject.toml"

[tool.pylint]
# You can add pylint configs here or in .pylintrc

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
