[project]
name = "crczp-python-commons"
version = "2.1.0"
description = "crczp python commons"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "cybersecurityhub.cz" }]
dependencies = [
    "crczp-topology-definition",
    # All four are imported directly by crczp/cloud_commons. netaddr and yamlize also
    # arrive via topology-definition, but a direct import warrants a direct declaration;
    # PyYAML and typing_extensions arrive from nowhere, so a standalone install used to
    # fail on `import crczp.cloud_commons`.
    "PyYAML>=6.0.2",
    "netaddr>=0.7",
    "typing_extensions>=4.0.0",
    "yamlize>=0.6"
]
[project.optional-dependencies]
dev = [
    "types-PyYAML",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-mock",
    "pytest-structlog",
]

lint = [
    "pylint",
    # pylint lints tests/ too, so it needs whatever the tests import.
    { include-group = "test" },
]

[tool.uv.sources]
crczp-topology-definition = { workspace = true }

[build-system]
# TODO: Replace this with uv_build when it is it released for GA.
#   https://github.com/astral-sh/uv/issues/3957
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crczp"]

[tool.ruff]
line-length = 100
preview = true

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-bandit: the security lint that the bandit tox env used to run
    "S",
]
# Carried over from the former [tool.bandit] skips: asserts are allowed (B101), and
# `random` is used for non-cryptographic values only (B311).
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
# Fixture credentials and scratch paths are expected in tests.
"tests/**" = ["S105", "S106", "S108"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.pylint]
# You can add pylint configs here or in .pylintrc

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
