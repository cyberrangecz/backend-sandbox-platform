[project]
name = "crczp-python-commons"
version = "2.1.0"
description = "crczp python commons"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "cybersecurityhub.cz" }]
dependencies = [
    "crczp-topology-definition",
    # Both are imported directly by crczp/cloud_commons. pydantic also arrives via
    # topology-definition, but a direct import warrants a direct declaration; PyYAML
    # arrives from nowhere, so a standalone install used to fail on
    # `import crczp.cloud_commons`.
    "pyyaml>=6.0.3",
    "pydantic>=2.14.1"
]
[project.optional-dependencies]
dev = [
    "types-pyyaml",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-mock",
    "pytest-structlog",
]

lint = [
    "pylint",
    # pylint lints tests/ too, so it needs whatever the tests import.
    { include-group = "test" },
]

[tool.uv.sources]
crczp-topology-definition = { workspace = true }

[build-system]
# TODO: Replace this with uv_build when it is it released for GA.
#   https://github.com/astral-sh/uv/issues/3957
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crczp"]

[tool.ruff]
# Shared settings live in the workspace root pyproject.toml; only deviations go here.
extend = "../../pyproject.toml"

[tool.ruff.lint]
# Added to the root ignore list (no `select` here, so the two accumulate): `random` is
# used for non-cryptographic values only (former bandit skip B311).
ignore = ["S311"]

[tool.pylint]
# You can add pylint configs here or in .pylintrc

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
