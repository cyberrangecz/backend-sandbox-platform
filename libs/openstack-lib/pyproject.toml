[project]
name = "crczp-openstack-lib"
version = "1.1.0"
description = "Cyberrangecz platform OpenStack Driver Python lib"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "cybersecurityhub.cz" }]
dependencies = [
    "pyyaml>=6.0.3",
    "crczp-python-commons",
    "crczp-topology-definition",
    "jinja2>=3.1.6",
    "keystoneauth1>=5.11.0",
    # Capped below 4.19: from 4.19 a service missing from the catalog is cached as a
    # disabled proxy for the life of the Connection, which is the life of the process here.
    # That needs its own reviewed bump and a check against a real cloud.
    "openstacksdk>=4.18.0,<4.19",
    "structlog>=26.1.0",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-mock",
    "pytest-structlog",
    # tests/test_integration.py: from Crypto.PublicKey import RSA
    "pycryptodome",
    # tests/test_open_stack_proxy.py: from ruamel.yaml import YAML
    "ruamel.yaml",
]

lint = [
    "pylint",
    # pylint lints tests/ too, so it needs whatever the tests import.
    { include-group = "test" },
]

[project.urls]
GitHub = "https://github.com/cyberrangecz/backend-sandbox-platform"

[tool.uv.sources]
crczp-python-commons = { workspace = true }
crczp-topology-definition = { workspace = true }

[build-system]
# TODO: Replace this with uv_build when it is it released for GA.
#   https://github.com/astral-sh/uv/issues/3957
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crczp"]

[tool.ruff]
# Shared settings live in the workspace root pyproject.toml; only deviations go here.
extend = "../../pyproject.toml"

[tool.ruff.lint]
# Added to the root ignore list (no `select` here, so the two accumulate): `random` is
# used for non-cryptographic values only (former bandit skip B311).
ignore = ["S311"]

[tool.pylint]
# You can add pylint configs here or in .pylintrc

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
