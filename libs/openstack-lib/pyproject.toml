[project]
name = "crczp-openstack-lib"
version = "1.0.6"
description = "Cyberrangecz platform OpenStack Driver Python lib"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "cybersecurityhub.cz" }]
dependencies = [
    "PyYAML>=6.0.2",
    "crczp-python-commons",
    "jinja2>=3.1.3",
    "keystoneauth1>=5.11.0",
    "netaddr>=1.3.0",
    "structlog>=25.3.0",
    "deepdiff>=8.4.2",
    "yamlize>=0.7.0",
    "python-glanceclient>=4.8.0",
    "python-keystoneclient>=5.6.0",
    "python-neutronclient>=14.0.0",
    "python-novaclient>=18.9.0"
]

[dependency-groups]
test = [
    "pytest",
    "pytest-mock",
    "pytest-structlog",
    # tests/test_integration.py: from Crypto.PublicKey import RSA
    "pycryptodome",
]

lint = [
    "pylint",
    # pylint lints tests/ too, so it needs whatever the tests import.
    { include-group = "test" },
]

[project.urls]
GitHub = "https://github.com/cyberrangecz/backend-sandbox-platform"

[tool.uv.sources]
crczp-python-commons = { workspace = true }

[build-system]
# TODO: Replace this with uv_build when it is it released for GA.
#   https://github.com/astral-sh/uv/issues/3957
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crczp"]

[tool.ruff]
line-length = 100
preview = true

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-bandit: the security lint that the bandit tox env used to run
    "S",
]
# Carried over from the former [tool.bandit] skips: asserts are allowed (B101), and
# `random` is used for non-cryptographic values only (B311).
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
# Fixture credentials and scratch paths are expected in tests.
"tests/**" = ["S105", "S106", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["crczp"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.pylint]
# You can add pylint configs here or in .pylintrc

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
