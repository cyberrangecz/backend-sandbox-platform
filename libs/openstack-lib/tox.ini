[tox]
parallel_show_output = True
envlist = pylint, bandit, audit, pytest

[testenv]
deps =
    pytest
    pytest-mock
    pytest-structlog
    pycryptodome
    structlog
commands =
    pytest

[testenv:pylint]
deps =
    {[testenv]deps}
    pylint
    pycryptodome
    pyyaml
    typing_extensions
    netaddr
    yamlize
commands = pylint crczp tests --output-format=colorized --fail-under=9.5

[testenv:bandit]
deps = bandit
commands = bandit -r crczp

[testenv:audit]
deps = pip-audit
commands = pip-audit --progress-spinner=off .

[testenv:pytest]
testpaths = tests
markers = integration
