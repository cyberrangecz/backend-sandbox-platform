[project]
name = "crczp-topology-definition"
version = "2.2.0"
description = "topology-definition"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "cybersecurityhub.cz" }]
dependencies = [
    "pydantic>=2.14.3",
    "ruamel.yaml>=0.19.1"
]

[dependency-groups]
test = [
    "pytest",
    "pytest-mock",
    "pytest-structlog",
]

lint = [
    "pylint",
    # pylint lints tests/ too, so it needs whatever the tests import.
    { include-group = "test" },
]

[build-system]
# TODO: Replace this with uv_build when it is it released for GA.
#   https://github.com/astral-sh/uv/issues/3957
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crczp"]

[tool.ruff]
line-length = 100
preview = true

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-bandit: the security lint that the bandit tox env used to run
    "S",
]
# Carried over from the former [tool.bandit] skips: asserts are allowed (B101), and
# `random` is used for non-cryptographic values only (B311).
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
# Fixture credentials and scratch paths are expected in tests.
"tests/**" = ["S105", "S106", "S108"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.pylint]
# You can add pylint configs here or in .pylintrc

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "integration: mark test as integration test requiring external services",
]
