[project]
name = "crczp-automated-problem-generation-lib"
version = "1.0.3"
description = "Random generator of selected variables"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Daniel Kosc", email = "485652@mail.muni.cz" }]
dependencies = [
    "pyyaml>=6.0.3"
]

[dependency-groups]
test = [
    "pytest",
    "pytest-mock",
    "pytest-structlog",
]

lint = [
    "pylint",
    # pylint lints tests/ too, so it needs whatever the tests import.
    { include-group = "test" },
]

[build-system]
# TODO: Replace this with uv_build when it is it released for GA.
#   https://github.com/astral-sh/uv/issues/3957
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator"]

[tool.ruff]
# Shared settings live in the workspace root pyproject.toml; only deviations go here.
extend = "../../pyproject.toml"

[tool.ruff.lint]
# Added to the root ignore list (no `select` here, so the two accumulate): `random` is
# used for non-cryptographic values only (former bandit skip B311).
ignore = ["S311"]

[tool.pylint]
# You can add pylint configs here or in .pylintrc

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
