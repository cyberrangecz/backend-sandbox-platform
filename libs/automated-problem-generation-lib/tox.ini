[tox]
parallel_show_output = True
envlist = pylint, pytest

# Every env is built by `uv sync --locked` against the workspace uv.lock, so sibling
# crczp-* packages install editable from libs/ and every third-party version is exactly
# what the lockfile pins - the same set the image ships.
#
# NOTE: this runner does not support `deps =` at all, it is silently ignored. Tooling
# belongs in the [dependency-groups] tables in pyproject.toml.
[testenv]
runner = uv-venv-lock-runner
# Test what the image ships (python:3.12-slim), not whatever interpreter runs tox -
# without this tox-uv derives it from its own tool env, which is 3.14 here.
base_python = python3.12

[testenv:pylint]
dependency_groups = lint
commands = pylint generator tests --output-format=colorized --fail-under=9.0

[testenv:pytest]
dependency_groups = test
commands = pytest
