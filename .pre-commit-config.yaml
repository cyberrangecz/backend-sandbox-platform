# Workspace-wide pre-commit configuration.
#
# pre-commit always changes to the repository root and passes it every tracked
# file, regardless of the directory it is invoked from. Per-package configs
# therefore cannot scope themselves in a monorepo — each would have linted the
# whole workspace with its own settings — so this is the only pre-commit config
# in the repository, and hooks are path-scoped here where they need to be.

repos:
  # Ruff resolves each package's own [tool.ruff] from the nearest pyproject.toml,
  # so one pass still applies the correct per-package settings.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.11
    hooks:
      - id: ruff-check
        name: ruff-lint
        args:
          - --output-format=github

      - id: ruff-format
        name: ruff-format
        args:
          - --check

  # One uv.lock at the root covers every workspace member.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.24
    hooks:
      - id: uv-lock
        # Upstream anchors this at both ends (^(uv\.lock|pyproject\.toml|uv\.toml)$), so
        # it matched only the root pair - and the root manifest has no [project] table, so
        # it can never carry a dependency change. Widened to the member manifests, which
        # are the only place dependencies are actually declared.
        files: (^|/)(uv\.lock|pyproject\.toml|uv\.toml)$

  # ty reads the single workspace-root [tool.ty]; see the note there on why the
  # type-checker config is not per-package. The hook wraps `uv check`, which takes
  # no ty flags, so the output format is set by TY_OUTPUT_FORMAT (github in CI).
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.75
    hooks:
      - id: ty

  - repo: local
    hooks:
      # Only sandbox-service is versioned and tagged in this repository; the six
      # libraries are no longer published, so they are not tag-controlled.
      #
      # This is the local pre-push gate; CI enforces the same rule again in the
      # `control_tag` job, but that only reports after a push. Ordering is compared with
      # `sort -V`, so a version LOWER than the latest tag fails too - the previous
      # equality-only test printed "version OK 2.4.2 -> 0.0.1" and exited 0, and a plain
      # string compare would also rank 2.10.0 below 2.9.0. Exits 0 only when the
      # repository genuinely has no semver tag yet.
      - id: check-version-bump
        name: check sandbox-service version bump
        language: system
        entry: 'bash -c ''current=$(git show :sandbox-service/pyproject.toml 2>/dev/null | grep -m1 "^version" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+"); latest=$(git tag --sort=-version:refname | grep -E "^v?[0-9]+\.[0-9]+\.[0-9]+$" | head -1 | sed "s/^v//"); [ -z "$latest" ] && exit 0; [ -z "$current" ] && { echo "Could not read version from sandbox-service/pyproject.toml" >&2; exit 1; }; lowest=$(printf "%s\n%s\n" "$current" "$latest" | sort -V | head -1); if [ "$current" = "$latest" ] || [ "$lowest" = "$current" ]; then echo "sandbox-service version $current is not higher than latest tag $latest" >&2; exit 1; fi; echo "sandbox-service version OK $latest -> $current"'''
        pass_filenames: false
        always_run: true
