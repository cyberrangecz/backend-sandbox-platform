# Single workflow for the whole workspace: quality for every package, plus the
# sandbox-service release path (image, OpenAPI docs, tag). Kept in one file so
# the release jobs can gate on the quality jobs via `needs:`.
#
# The six libraries are no longer published to PyPI, so there is no package
# build/publish job for them and only sandbox-service is tag-controlled.

name: Sandbox Workspace CI

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      confirm_action:
        description: "Type 'yes' if you want to create a new tag"
        required: true
        default: "no"

permissions:
  contents: read

jobs:
  # Each package runs when it changes, when anything it depends on changes, or
  # when a workspace-wide file changes. Filters list transitive dependencies
  # explicitly so a change low in the graph still exercises its consumers.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      topology-definition: ${{ steps.filter.outputs.topology-definition }}
      python-commons: ${{ steps.filter.outputs.python-commons }}
      openstack-lib: ${{ steps.filter.outputs.openstack-lib }}
      aws-lib: ${{ steps.filter.outputs.aws-lib }}
      terraform-client: ${{ steps.filter.outputs.terraform-client }}
      automated-problem-generation-lib: ${{ steps.filter.outputs.automated-problem-generation-lib }}
      sandbox-service: ${{ steps.filter.outputs.sandbox-service }}
      packages: ${{ steps.matrix.outputs.packages }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workspace: &workspace
              - 'pyproject.toml'
              - 'uv.lock'
              - '.pre-commit-config.yaml'
              - '.github/workflows/**'
            topology-definition:
              - *workspace
              - 'libs/topology-definition/**'
            python-commons:
              - *workspace
              - 'libs/topology-definition/**'
              - 'libs/python-commons/**'
            openstack-lib:
              - *workspace
              - 'libs/topology-definition/**'
              - 'libs/python-commons/**'
              - 'libs/openstack-lib/**'
            aws-lib:
              - *workspace
              - 'libs/topology-definition/**'
              - 'libs/python-commons/**'
              - 'libs/aws-lib/**'
            terraform-client:
              - *workspace
              - 'libs/topology-definition/**'
              - 'libs/python-commons/**'
              - 'libs/openstack-lib/**'
              - 'libs/aws-lib/**'
              - 'libs/terraform-client/**'
            automated-problem-generation-lib:
              - *workspace
              - 'libs/automated-problem-generation-lib/**'
            sandbox-service:
              - *workspace
              - 'libs/**'
              - 'sandbox-service/**'

      # Build the matrix from the filters that matched. Done explicitly rather
      # than via paths-filter's `changes` output, which would also include the
      # `workspace` helper filter, and that is not a package.
      - id: matrix
        run: |
          pkgs=()
          add() { if [ "$2" = "true" ]; then pkgs+=("$1"); fi; }
          add libs/topology-definition               "${{ steps.filter.outputs.topology-definition }}"
          add libs/python-commons                    "${{ steps.filter.outputs.python-commons }}"
          add libs/openstack-lib                     "${{ steps.filter.outputs.openstack-lib }}"
          add libs/aws-lib                           "${{ steps.filter.outputs.aws-lib }}"
          add libs/terraform-client                  "${{ steps.filter.outputs.terraform-client }}"
          add libs/automated-problem-generation-lib  "${{ steps.filter.outputs.automated-problem-generation-lib }}"
          add sandbox-service                        "${{ steps.filter.outputs.sandbox-service }}"
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo 'packages=[]' >> "$GITHUB_OUTPUT"
          else
            printf 'packages=%s\n' "$(printf '%s\n' "${pkgs[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi


  # Runs once for the whole workspace; see .pre-commit-config.yaml for why this
  # is not part of the per-package matrix.
  pre-commit:
    name: pre-commit (workspace)
    runs-on: ubuntu-24.04
    env:
      FORCE_COLOR: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.24"

      - name: Install pre-commit
        run: uv tool install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  # One job per (changed package x tox env), replacing the seven near-identical
  # reusable-workflow call sites.
  quality:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      TERM: xterm-256color
      FORCE_COLOR: "1"
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
        env: [pylint, bandit, audit, pytest]
    name: ${{ matrix.package }} (${{ matrix.env }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.24"
      - run: uv tool install tox --with tox-uv
      # tox builds the package in an isolated env; uv honours the workspace
      # sources, so sibling crczp-* deps resolve from libs/ rather than PyPI.
      - working-directory: ${{ matrix.package }}
        run: tox -q -e ${{ matrix.env }}

  get_current_version:
    uses: cyberrangecz/actions-templates/.github/workflows/get_version.yml@master
    with:
      file_path: "sandbox-service/pyproject.toml"

  build:
    if: needs.changes.outputs.sandbox-service == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: [changes, get_current_version, quality, pre-commit]
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.get_current_version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build context is the repository root so the uv workspace can resolve
      # libs/* as path dependencies; see sandbox-service/Dockerfile.
      - name: Build and push Docker image
        env:
          TAG: ${{ github.ref == 'refs/heads/master' && format('{0}', env.VERSION ) || format('{0}-dev', env.VERSION) }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./sandbox-service/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/sandbox-service:${{ env.TAG }}

  generate_docs:
    permissions:
      contents: read
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.24"

      - name: Generate and Push Swagger Docs
        working-directory: sandbox-service
        run: |
          cp config.yml-template ./config.yml
          mkdir -p output
          uv run python manage.py spectacular --file output/crczp-sandbox-service-swagger-open-api.yaml

      - name: Upload Docs files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: sandbox-service/output

  upload_docs:
    needs: generate_docs
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Controls if version consistent with semver and higher than last git tag.
  control_tag:
    if: github.event.pull_request.base.ref == 'master' || github.ref == 'refs/heads/master'
    needs: get_current_version
    uses: cyberrangecz/actions-templates/.github/workflows/tag_control_template.yml@master
    with:
      VERSION: ${{ needs.get_current_version.outputs.version }}

  # Push tag only from manual workflow_dispatch with confirmed tag creation
  push_tag:
    if: github.ref == 'refs/heads/master' && github.event.inputs.confirm_action == 'yes'
    needs: [get_current_version, control_tag, build]
    permissions:
      contents: write
    uses: cyberrangecz/actions-templates/.github/workflows/tag_push_template.yml@master
    with:
      VERSION: ${{ needs.get_current_version.outputs.version }}
