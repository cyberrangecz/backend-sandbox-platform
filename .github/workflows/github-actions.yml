# Single workflow for the whole workspace: quality for every package, plus the
# sandbox-service release path (image, OpenAPI docs, tag). Kept in one file so
# the release jobs can gate on the quality jobs via `needs:`.
#
# The six libraries are no longer published to PyPI, so there is no package
# build/publish job for them and only sandbox-service is tag-controlled.
#
# Security gating follows one rule: a run fails on what it introduces, and only reports
# what it inherits. A CVE published against a dependency set the branch did not touch is
# not the branch's problem - it is fixed in its own PR to master, and the nightly run in
# security-schedule.yml keeps an issue open until it is. The master run (workflow_dispatch,
# which builds the versioned image and tags) is the hard gate and fails on everything.

name: Sandbox Workspace CI

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      confirm_action:
        description: "Type 'yes' if you want to create a new tag"
        required: true
        default: "no"

permissions:
  contents: read

jobs:
  # Each package runs when it changes, when anything it depends on changes, or
  # when a workspace-wide file changes. Filters list transitive dependencies
  # explicitly so a change low in the graph still exercises its consumers.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      topology-definition: ${{ steps.filter.outputs.topology-definition }}
      python-commons: ${{ steps.filter.outputs.python-commons }}
      openstack-lib: ${{ steps.filter.outputs.openstack-lib }}
      aws-lib: ${{ steps.filter.outputs.aws-lib }}
      terraform-client: ${{ steps.filter.outputs.terraform-client }}
      automated-problem-generation-lib: ${{ steps.filter.outputs.automated-problem-generation-lib }}
      sandbox-service: ${{ steps.filter.outputs.sandbox-service }}
      packages: ${{ steps.matrix.outputs.packages }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workspace: &workspace
              - 'pyproject.toml'
              - 'uv.lock'
              - '.pre-commit-config.yaml'
              - '.github/workflows/**'
            topology-definition:
              - *workspace
              - 'libs/topology-definition/**'
            python-commons:
              - *workspace
              - 'libs/topology-definition/**'
              - 'libs/python-commons/**'
            openstack-lib:
              - *workspace
              - 'libs/topology-definition/**'
              - 'libs/python-commons/**'
              - 'libs/openstack-lib/**'
            aws-lib:
              - *workspace
              - 'libs/topology-definition/**'
              - 'libs/python-commons/**'
              - 'libs/aws-lib/**'
            terraform-client:
              - *workspace
              - 'libs/topology-definition/**'
              - 'libs/python-commons/**'
              - 'libs/openstack-lib/**'
              - 'libs/aws-lib/**'
              - 'libs/terraform-client/**'
            automated-problem-generation-lib:
              - *workspace
              - 'libs/automated-problem-generation-lib/**'
            sandbox-service:
              - *workspace
              - 'libs/**'
              - 'sandbox-service/**'

      # Build the matrix from the filters that matched. Done explicitly rather
      # than via paths-filter's `changes` output, which would also include the
      # `workspace` helper filter, and that is not a package.
      - id: matrix
        run: |
          pkgs=()
          add() { if [ "$2" = "true" ]; then pkgs+=("$1"); fi; }
          add libs/topology-definition               "${{ steps.filter.outputs.topology-definition }}"
          add libs/python-commons                    "${{ steps.filter.outputs.python-commons }}"
          add libs/openstack-lib                     "${{ steps.filter.outputs.openstack-lib }}"
          add libs/aws-lib                           "${{ steps.filter.outputs.aws-lib }}"
          add libs/terraform-client                  "${{ steps.filter.outputs.terraform-client }}"
          add libs/automated-problem-generation-lib  "${{ steps.filter.outputs.automated-problem-generation-lib }}"
          add sandbox-service                        "${{ steps.filter.outputs.sandbox-service }}"
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo 'packages=[]' >> "$GITHUB_OUTPUT"
          else
            printf 'packages=%s\n' "$(printf '%s\n' "${pkgs[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi


  # Runs once for the whole workspace; see .pre-commit-config.yaml for why this
  # is not part of the per-package matrix.
  pre-commit:
    name: pre-commit (workspace)
    runs-on: ubuntu-24.04
    env:
      FORCE_COLOR: "1"
      # The ty hook wraps `uv check` and takes no ty flags, so its output format
      # is set here rather than in .pre-commit-config.yaml.
      TY_OUTPUT_FORMAT: github
      # The gitleaks hook scans staged changes only, and nothing is staged in CI, so it
      # would compile itself with Go to check nothing. The `secrets` job runs gitleaks
      # over this run's commits instead.
      SKIP: gitleaks
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # The check-version-bump hook compares against the latest git tag. The default
          # shallow, --no-tags checkout left `git tag` empty, so the hook always took its
          # "no tags yet" exit 0 and verified nothing in the one place it runs unattended.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.24"
          python-version: "3.12"

      - name: Install pre-commit
        run: uv tool install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  # Commits this run brings in, scanned for secrets by two tools that fail on different
  # things. Any failure here is a leak already published to a public repository: rotate
  # the credential, rewriting history does not un-publish it. The full history is
  # rescanned weekly by security-schedule.yml.
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Both scans walk a commit range, so both ends must be present.
          fetch-depth: 0

      # Pattern match, no verification: catches passwords and keys no issuer can confirm.
      # Same rules and allowlist (.gitleaks.toml) as the pre-commit hook, run here for
      # anyone who has not installed the hook. Scans the PR's commits, or on a push the
      # branch's commits not yet on master (empty, so a no-op, for the master run).
      # --redact matters: this repository's Actions logs are public.
      - name: gitleaks
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'origin/master..HEAD' }}
        run: >-
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --log-opts="$RANGE" --redact --no-banner --verbose

      # Only verified results fail: TruffleHog proves a hit is live against its issuer.
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.98.0
        with:
          version: 3.98.0
          extra_args: --results=verified

  # One job per (changed package x tox env), replacing the seven near-identical
  # reusable-workflow call sites.
  quality:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      TERM: xterm-256color
      FORCE_COLOR: "1"
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
        # Security lint is ruff's `S` rules in pre-commit; the dependency audit is the
        # `audit` job below, since one run over sandbox-service covers every library.
        env: [pylint, pytest]
    name: ${{ matrix.package }} (${{ matrix.env }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.24"
          python-version: "3.12"
      # tox-uv-bare, not tox-uv: the meta package depends on `uv<1,>=0.9.27` and would
      # install the newest match into the tool env, so a third uv version would read the
      # lockfile. The bare plugin falls through to `which uv`, i.e. the pin above.
      - run: uv tool install tox --with tox-uv-bare==1.36.0
      # Each tox env is built by `uv sync --locked` (runner = uv-venv-lock-runner in every
      # tox.ini), so sibling crczp-* packages install editable from libs/ and every
      # third-party version is exactly what uv.lock pins - the set the image ships.
      # Tooling comes from each package's [dependency-groups].
      - working-directory: ${{ matrix.package }}
        run: tox -q -e ${{ matrix.env }}

  # Dependency audit of the locked set the image ships (sandbox-service/audit.sh). Fails
  # only on vulnerabilities this change introduces, compared with BASE; inherited ones go
  # to the job summary and are tracked by the nightly issue from security-schedule.yml.
  # The master run sets no BASE, so there every known vulnerability blocks the release.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The base revision is checked out as a worktree and audited too.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.24"
          python-version: "3.12"
      - run: uv tool install tox --with tox-uv-bare==1.36.0

      - name: pip-audit
        working-directory: sandbox-service
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          # A branch push compares with where the branch left master.
          if [ -z "$BASE" ] && [ "$GITHUB_REF" != refs/heads/master ]; then
            BASE=$(git merge-base origin/master HEAD)
          fi
          tox -q -e audit

  get_current_version:
    uses: cyberrangecz/actions-templates/.github/workflows/get_version.yml@master
    with:
      file_path: "sandbox-service/pyproject.toml"

  build:
    # Dependabot's pushes get a read-only GITHUB_TOKEN, so the image push could only fail;
    # its PRs still run every check above.
    if: >-
      needs.changes.outputs.sandbox-service == 'true'
      && github.event_name != 'pull_request'
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    needs: [changes, quality, pre-commit, audit, secrets]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only, with no tag: nothing can pull it by version until `publish`
      # tags it after the scan. Build context is the repository root so the uv workspace
      # can resolve libs/* as path dependencies; see sandbox-service/Dockerfile.
      # The SBOM and provenance are attached to the image as attestations: a record of
      # exactly what each released version ships and how it was built, readable with
      # `docker buildx imagetools inspect <image> --format '{{ json .SBOM }}'`.
      - name: Build and push Docker image by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./sandbox-service/Dockerfile
          tags: ghcr.io/${{ github.repository }}/sandbox-service
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
    outputs:
      image: ghcr.io/${{ github.repository }}/sandbox-service@${{ steps.push.outputs.digest }}

  # grype over the digest `build` pushed. pip-audit (the `audit` job) sees only the Python
  # set; this also covers the Debian base, the apt packages and the OpenTofu and provider
  # binaries. Reports on branch builds. On the master run it fails on high or critical
  # findings that have a fix, and then `publish` never tags the image.
  image-scan:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image (grype)
        id: grype
        uses: anchore/scan-action@v7.4.2
        with:
          image: ${{ needs.build.outputs.image }}
          fail-build: ${{ github.ref == 'refs/heads/master' }}
          severity-cutoff: high
          only-fixed: true
          output-format: table
          output-file: ${{ runner.temp }}/grype.txt

      - name: Image scan summary
        if: ${{ !cancelled() && steps.grype.conclusion != 'skipped' }}
        run: |
          {
            echo '### Image vulnerabilities (high and above, with a fix available)'
            echo '```'
            cat "$RUNNER_TEMP/grype.txt" 2>/dev/null || echo 'grype produced no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Tags the scanned digest - the same image index, attestations included, no rebuild.
  # This is the moment a version becomes pullable, so on the master run it waits for a
  # passing scan: a failing release leaves only an untagged digest behind. On branches the
  # scan is report-only, so the -dev tag is published even if the scan job itself errored.
  publish:
    needs: [build, image-scan, get_current_version]
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && (needs.image-scan.result == 'success' || github.ref != 'refs/heads/master')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref == 'refs/heads/master' && needs.get_current_version.outputs.version || format('{0}-dev', needs.get_current_version.outputs.version) }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image
        run: docker buildx imagetools create --tag "ghcr.io/${GITHUB_REPOSITORY}/sandbox-service:${TAG}" "$IMAGE"

  generate_docs:
    permissions:
      contents: read
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    needs: publish
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.24"
          python-version: "3.12"

      - name: Generate and Push Swagger Docs
        working-directory: sandbox-service
        run: |
          cp config.yml-template ./config.yml
          mkdir -p output
          uv run python manage.py spectacular --file output/crczp-sandbox-service-swagger-open-api.yaml

      - name: Upload Docs files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: sandbox-service/output

  upload_docs:
    needs: generate_docs
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Controls if version consistent with semver and higher than last git tag.
  control_tag:
    if: github.event.pull_request.base.ref == 'master' || github.ref == 'refs/heads/master'
    needs: get_current_version
    uses: cyberrangecz/actions-templates/.github/workflows/tag_control_template.yml@master
    with:
      VERSION: ${{ needs.get_current_version.outputs.version }}

  # Push tag only from manual workflow_dispatch with confirmed tag creation
  push_tag:
    if: github.ref == 'refs/heads/master' && github.event.inputs.confirm_action == 'yes'
    needs: [get_current_version, control_tag, publish]
    permissions:
      contents: write
    uses: cyberrangecz/actions-templates/.github/workflows/tag_push_template.yml@master
    with:
      VERSION: ${{ needs.get_current_version.outputs.version }}
