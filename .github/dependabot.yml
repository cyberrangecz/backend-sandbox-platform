# Opens the fix PRs that the security gating relies on: an inherited CVE does not block
# feature branches, so something has to propose the bump to master (see the header of
# workflows/github-actions.yml). Security updates open as soon as an advisory is published,
# provided "Dependabot security updates" is enabled in the repository settings.
#
# No `docker` entry: its only candidates would break pins on purpose. python:3.12-slim
# must stay on 3.12, and the uv image is held in step with the workflows and pre-commit.
# Base-image patches arrive anyway, since that tag floats and every build pulls it.

version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # One PR for routine bumps instead of one per package; majors stay separate.
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
