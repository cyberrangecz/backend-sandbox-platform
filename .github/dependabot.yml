# Opens the fix PRs that the security gating relies on: an inherited CVE does not block
# feature branches, so something has to propose the bump to master (see the header of
# workflows/github-actions.yml). Security updates open as soon as an advisory is published,
# provided "Dependabot security updates" is enabled in the repository settings.
#
# No `docker` entry: its only candidates would break pins on purpose. python:3.12-slim
# must stay on 3.12, and the uv image is held in step with the workflows and pre-commit.
# Base-image patches arrive anyway, since that tag floats and every build pulls it.

version: 2
updates:
  - package-ecosystem: uv
    directory: /
    # Version updates twice a month, on the 1st and 15th at 03:00 UTC: each uv PR needs a
    # sandbox-service version bump by hand. Security updates do not wait for this schedule.
    schedule:
      interval: cron
      cronjob: "0 3 1,15 * *"
    # pyproject.toml declares lower bounds and uv.lock pins the exact versions, so an update
    # the bounds already allow only changes uv.lock. The default (`increase`) would rewrite
    # every bumped lower bound in pyproject.toml as well.
    versioning-strategy: increase-if-necessary
    # Deliberate holds, each matching an upper bound in a pyproject.toml. Dependabot would
    # otherwise raise the bound together with the version.
    ignore:
      - dependency-name: django # kept on the 5.2 LTS line
        versions: [">=6"]
      - dependency-name: kubernetes # see sandbox-service/pyproject.toml
        versions: [">=37"]
      - dependency-name: openstacksdk # see libs/openstack-lib/pyproject.toml
        versions: [">=4.19"]
      - dependency-name: djangorestframework-stubs # see sandbox-service/pyproject.toml
        versions: [">=3.17.1"]
    # One PR for routine bumps instead of one per package; majors stay separate.
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    # Same schedule as uv above.
    schedule:
      interval: cron
      cronjob: "0 3 1,15 * *"
    groups:
      actions:
        patterns: ["*"]
